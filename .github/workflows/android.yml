name: Compilar APK Jarvis

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Dar permissão de execução ao Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Gerar o Gradle Wrapper (caso não exista)
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --stacktrace

    - name: Salvar o APK gerado para Download
      uses: actions/upload-artifact@v4
      with:
        name: JarvisAndroid-APK
        path: app/build/outputs/apk/debug/app-debug.apk
